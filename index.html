<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171817">
  <meta name="description" content="Explore grandes sítios de arte rupestre no mapa-múndi: pinturas, gravuras e petróglifos de diferentes períodos e regiões.">
  <title>Vestígios — Atlas de arte rupestre</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23171817'/%3E%3Cpath d='M10 12l10 19 10-19M14 12h12' fill='none' stroke='%23c88b62' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data/world.js"></script>
  <script defer src="data/sites.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <div id="map" tabindex="0" role="application" aria-label="Mapa-múndi interativo de sítios de arte rupestre">
      <div class="map-loading">Carregando mapa…</div>
    </div>

    <div class="map-signature" aria-hidden="true">
      <span>VESTÍGIOS</span>
      <small>ATLAS DE ARTE RUPESTRE</small>
    </div>

    <div class="map-controls" aria-label="Controles do mapa">
      <button id="zoom-in" aria-label="Aproximar mapa" title="Aproximar">+</button>
      <button id="zoom-out" aria-label="Afastar mapa" title="Afastar">−</button>
      <button id="reset" aria-label="Mostrar o mundo inteiro" title="Visão mundial">⌂</button>
    </div>

    <div class="compass" aria-hidden="true"><span>N</span><i></i></div>

    <div class="map-note" aria-hidden="true">
      <span class="legend-dot"></span>
      <span>25 sítios de arte rupestre</span>
      <span class="note-separator"></span>
      <span>arraste para explorar</span>
    </div>

    <aside id="site-card" class="site-card" aria-labelledby="card-title" hidden>
      <button id="close-card" class="close-card" aria-label="Fechar cartão">×</button>

      <div class="photo-wrap">
        <img id="site-photo" alt="">
        <div class="photo-shade"></div>
        <div id="photo-error" hidden>
          Fotografia indisponível.
          <a id="photo-fallback" target="_blank" rel="noopener">Consultar imagem original</a>
        </div>
        <span class="photo-tag">ARTE RUPESTRE</span>
        <span id="card-index" class="photo-index"></span>
      </div>

      <div class="card-body">
        <div class="card-topline">
          <span id="card-region"></span>
          <span>ARQUIVO VISUAL</span>
        </div>

        <h2 id="card-title" tabindex="-1"></h2>
        <p id="card-description" class="card-description"></p>

        <dl class="facts">
          <div>
            <dt>CRONOLOGIA</dt>
            <dd id="card-age"></dd>
          </div>
          <div>
            <dt>LOCALIZAÇÃO</dt>
            <dd id="card-country"></dd>
          </div>
        </dl>

        <div class="dating">
          <span id="card-period"></span>
          <p id="card-note"></p>
        </div>

        <div class="card-footer">
          <a id="source-link" target="_blank" rel="noopener">Referência</a>
          <a id="image-link" target="_blank" rel="noopener">Fotografia</a>
        </div>
        <p id="image-credit" class="credit"></p>
      </div>
    </aside>

    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
    <noscript><div class="noscript">Ative o JavaScript para explorar o mapa.</div></noscript>
  </main>
</body>
</html>
